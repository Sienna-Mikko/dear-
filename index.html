<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GPT 文本重点提取器（规则增强版）</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">

      <h1>GPT 文本重点提取器（规则增强版）</h1>
      <p class="intro">
        输入一段 GPT 回复后，系统会按三类规则提取重点：
        <strong>加粗 1-5 个短句/词语</strong>、<strong>加粗 1-5 个长句</strong>、<strong>倾斜 1-3 个短句</strong>。

      </p>

      <label for="inputText">输入文本</label>
      <textarea id="inputText" rows="10" placeholder="把 GPT 的一段文字粘贴到这里..."></textarea>

      <div class="actions">
        <button id="analyzeBtn">提取重点</button>
        <button id="demoBtn" class="secondary">填充示例</button>
      </div>


      <section class="rule-note">
        <h2>筛选规则（简版）</h2>
        <ul>
          <li>短句/词语：优先提取含强调词、情绪词、感叹/疑问语气的片段（1-5 条）。</li>
          <li>长句：优先提取信息密度高、长度较长且包含强调表达的句子（1-5 条）。</li>
          <li>倾斜短句：从短句中补充情绪峰值表达，最多 3 条，尽量避免与加粗重复。</li>
        </ul>
      </section>

      <section class="result-section">
        <h2>加粗：短句/词语（1-5）</h2>
        <ol id="boldShortList"></ol>
      </section>

      <section class="result-section">
        <h2>加粗：长句（1-5）</h2>
        <ol id="boldLongList"></ol>
      </section>

      <section class="result-section">
        <h2>倾斜：短句（1-3）</h2>
        <ol id="italicShortList"></ol>

      </section>

      <section class="result-section">
        <h2>标注后的文本</h2>
        <div id="annotatedText" class="annotated" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
